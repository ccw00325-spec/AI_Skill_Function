# Gemini CLI 사용자 명령 어댑터 (초안 · 실행 미검증)
#
# 형식 근거: Gemini CLI 문서 docs/cli/custom-commands.md (2026-10-06 확인)
#   - 프로젝트 명령 위치: <프로젝트>/.gemini/commands/  → 이 파일 이름이 Fun.toml 이면 명령은 /Fun
#   - {{args}} 는 사용자가 명령 뒤에 적은 글로 바뀐다.
#   - @{경로} 는 파일 내용을 넣는다. 작업 공간(workspace) 밖의 경로는 쓸 수 없다.
#     그래서 공통 본문 SKILL.md 를 프로젝트 안 .gemini/fun/SKILL.md 로 복사해 두어야 한다.
#     복사본은 이 저장소의 SKILL.md 와 같아야 하며 따로 고치지 않는다.
#
# 확인하지 못한 것: 명령 이름의 대소문자 구분, @{} 가 .gitignore 된 경로를 읽는지, 이 PC 에 Gemini CLI 가 없어 실제 실행.

description = "Fun: 누락된 결정을 질문으로 드러내고 승인된 범위만 구현·명세화한다 (공통 본문 .gemini/fun/SKILL.md)"

prompt = """
아래 공통 본문을 이 대화의 작업 규칙으로 따른다. 이 명령 파일은 호출을 연결할 뿐이며 규칙을 바꾸지 않는다.

@{.gemini/fun/SKILL.md}

사용자 요청: /Fun {{args}}
"""
